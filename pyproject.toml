[project]
name = "zcloud-ai-telecaller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shameer28tm", email = "shameertmdevop@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "livekit-agents>=1.8.2",
    "livekit-plugins-openai>=1.8.0",
    "livekit-plugins-silero>=1.8.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
zcloud-ai-telecaller = "zcloud_ai_telecaller:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
